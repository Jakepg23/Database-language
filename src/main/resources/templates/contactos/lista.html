<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{layout :: head('Gestión de Contactos')}"></head>

<body>

<div th:replace="~{layout :: layout(~{::contenido})}">

    <div th:fragment="contenido">

        <h1 class="mb-4">Gestión de Contactos</h1>

        <!-- ALERTAS -->
        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

        <script th:if="${error == 'correo'}">
            Swal.fire({
                icon: 'error',
                title: 'Correo duplicado',
                text: 'Este correo ya existe en el sistema.',
                confirmButtonText: 'Aceptar'
            });
        </script>

        <script th:if="${error == 'telefono'}">
            Swal.fire({
                icon: 'error',
                title: 'Teléfono duplicado',
                text: 'Este teléfono ya existe en el sistema.',
                confirmButtonText: 'Aceptar'
            });
        </script>


        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Cédula</th>
                    <th>Nombre Completo</th>
                    <th>Correos</th>
                    <th>Teléfonos</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="c : ${contactos}">
                    <td th:text="${c.cedula}">123</td>
                    <td th:text="${c.nombreCompleto}">Nombre</td>

                    <!-- ========================= -->
                    <!-- CORREOS                     -->
                    <!-- ========================= -->
                    <td>
                        <div th:if="${c.emails != null}">
                            <div th:each="correo : ${c.emails.split(',')}"
                                 th:if="${correo.trim() != ''}"
                                 class="d-flex align-items-center mb-1">

                                <span class="badge bg-primary me-2"
                                      th:text="${correo.trim()}"></span>

                                <form th:action="@{'/contactos/eliminar-correo/' + ${c.cedula}}"
                                      method="post"
                                      onsubmit="return confirmarEliminarCorreo(event)"
                                      class="d-inline">
                                    <input type="hidden" name="correo" th:value="${correo.trim()}">
                                    <button class="btn btn-sm btn-danger px-2 py-0">✖</button>
                                </form>
                            </div>
                        </div>

                        <span th:if="${c.emails == null}">—</span>
                    </td>

                    <!-- ========================= -->
                    <!-- TELÉFONOS                -->
                    <!-- ========================= -->
                    <td>
                        <div th:if="${c.telefonos != null}">
                            <div th:each="tel : ${c.telefonos.split(',')}"
                                 th:if="${tel.trim() != ''}"
                                 class="d-flex align-items-center mb-1">

                                <span class="badge bg-success me-2"
                                      th:text="${tel.trim()}"></span>

                                <form th:action="@{'/contactos/eliminar-telefono/' + ${c.cedula}}"
                                      method="post"
                                      onsubmit="return confirmarEliminarTelefono(event)"
                                      class="d-inline">
                                    <input type="hidden" name="telefono" th:value="${tel.trim()}">
                                    <button class="btn btn-sm btn-danger px-2 py-0">✖</button>
                                </form>
                            </div>
                        </div>

                        <span th:if="${c.telefonos == null}">—</span>
                    </td>

                    <!-- ========================= -->
                    <!-- AGREGAR NUEVOS            -->
                    <!-- ========================= -->
                    <td class="d-flex flex-column gap-2">

                        <!-- AÑADIR CORREO -->
                        <form th:action="@{'/contactos/agregar-correo/' + ${c.cedula}}"
                              method="post"
                              class="d-flex gap-1">
                            <input type="email"
                                   name="nuevoCorreo"
                                   class="form-control form-control-sm"
                                   placeholder="Nuevo correo"
                                   required>

                            <button type="submit"
                                    class="btn btn-success btn-sm rounded-pill px-2">
                                ➕ Correo
                            </button>
                        </form>

                        <!-- AÑADIR TELÉFONO -->
                        <form th:action="@{'/contactos/agregar-telefono/' + ${c.cedula}}"
                              method="post"
                              class="d-flex gap-1">
                            <input type="text"
                                   name="nuevoTelefono"
                                   class="form-control form-control-sm"
                                   placeholder="Nuevo teléfono"
                                   required>

                            <button type="submit"
                                    class="btn btn-primary btn-sm rounded-pill px-2">
                                📞 Teléfono
                            </button>
                        </form>

                    </td>
                </tr>
            </tbody>

        </table>

    </div>

</div>


<!-- CONFIRMACIONES SWEETALERT -->
<script>
function confirmarEliminarCorreo(event) {
    event.preventDefault();
    Swal.fire({
        title: "¿Eliminar correo?",
        text: "Esta acción no se puede deshacer.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar"
    }).then((result) => {
        if (result.isConfirmed) {
            event.target.submit();
        }
    });
}

function confirmarEliminarTelefono(event) {
    event.preventDefault();
    Swal.fire({
        title: "¿Eliminar teléfono?",
        text: "Esta acción no se puede deshacer.",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "Sí, eliminar",
        cancelButtonText: "Cancelar"
    }).then((result) => {
        if (result.isConfirmed) {
            event.target.submit();
        }
    });
}
</script>

</body>
</html>
